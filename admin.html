<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播种幸福｜Admin Dashboard</title>
<style>
:root{--g:#355a42;--g2:#55725c;--sage:#e5eee1;--cream:#f5f0e7;--paper:#fffdf8;--ink:#30362f;--muted:#707870;--line:#dce5d9;--warn:#fff4d8;--danger:#9a4747}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f2e9,#edf3e9);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;border-radius:24px;padding:20px 22px;box-shadow:0 16px 45px rgba(53,90,66,.13)}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#e9f2e6}.topActions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;background:var(--g);color:#fff}.btn.soft{background:var(--sage);color:var(--g)}.btn.light{background:#fff;color:var(--g)}.btn.danger{background:#f7e8e8;color:var(--danger)}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(53,90,66,.06)}.card h2{margin:0 0 6px;color:var(--g)}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:13px}label{display:block;font-weight:850;color:var(--g);margin:11px 0 6px}input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status{min-height:22px;margin-top:9px;font-size:13px;line-height:1.5;white-space:pre-wrap}.ok{color:#2f6b49}.err{color:#a14444}.loginWrap{min-height:78vh;display:grid;place-items:center}.loginCard{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(53,90,66,.12)}.loginCard h1{color:var(--g);margin:0 0 8px}.hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{max-width:330px}.memberList{display:grid;gap:10px}.member{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.memberHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.memberName{font-weight:900;color:var(--g);font-size:16px}.memberEmail{font-size:12px;color:var(--muted);margin-top:3px}.pill{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:var(--sage);color:var(--g)}.pill.inactive{background:#f4e7e4;color:#8a483f}.memberGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.memberGrid label{margin:0 0 5px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tempResult{display:none;margin-top:12px;background:var(--warn);border:1px solid #ead19a;border-radius:14px;padding:13px}.tempResult.show{display:block}.tempCode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:900;word-break:break-all;margin:7px 0}.note{background:#eef4eb;border-radius:13px;padding:12px;font-size:12px;line-height:1.55;color:#536058}@media(max-width:860px){.grid{grid-template-columns:1fr}.memberGrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="shell">
  <section id="loginView" class="loginWrap">
    <div class="loginCard">
      <div style="font-weight:900;color:#b18a4f">🌱 播种幸福</div>
      <h1>Admin Dashboard</h1>
      <p class="sub">只有已登记为管理员的账号才能管理学员。</p>
      <label>Email</label><input id="adminEmail" type="email" autocomplete="email">
      <label>Password</label><input id="adminPassword" type="password" autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:14px" onclick="adminLogin()">管理员登录</button>
      <div id="loginStatus" class="status"></div>
    </div>
  </section>

  <section id="dashboardView" class="hidden">
    <div class="top">
      <div><h1>🌱 播种幸福｜学员管理</h1><p>新增学员、开通权限、重置临时密码。</p></div>
      <div class="topActions"><button class="btn light" onclick="refreshMembers()">刷新名单</button><button class="btn light" onclick="window.open('./index.html','_blank')">打开课程</button><button class="btn light" onclick="adminLogout()">退出</button></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>＋ 新增学员</h2>
        <div class="sub">系统会自动建立 Supabase Auth 账号、课程权限，并生成一次临时密码。</div>
        <label>学员姓名</label><input id="newName" placeholder="例如：王小美">
        <label>Email</label><input id="newEmail" type="email" placeholder="student@example.com">
        <div class="row2">
          <div><label>开始日期</label><input id="newStart" type="date"></div>
          <div><label>课程期限</label>
            <select id="newDuration" onchange="durationChanged()">
              <option value="permanent">不限期</option>
              <option value="30">30 天</option>
              <option value="365">365 天</option>
              <option value="custom">自订到期日</option>
            </select>
          </div>
        </div>
        <div id="customExpiryWrap" class="hidden"><label>到期日期</label><input id="newExpiry" type="date"></div>
        <button class="btn" style="width:100%;margin-top:14px" onclick="createMember()">建立学员 + 临时密码</button>
        <div id="createStatus" class="status"></div>
        <div id="tempResult" class="tempResult">
          <b>临时密码（请复制后交给学员）</b>
          <div id="tempPassword" class="tempCode"></div>
          <button class="btn soft" onclick="copyTempPassword()">复制临时密码</button>
          <div class="note" style="margin-top:10px">学员第一次登录课程时，会被强制要求更换自己的新密码，然后才可以进入 21 天课程。</div>
        </div>
      </div>

      <div class="card">
        <h2>学员名单</h2>
        <div class="sub">可以修改 ACTIVE 状态、开始日、到期日，也可以重新生成临时密码。</div>
        <div class="toolbar"><input id="searchMember" placeholder="搜索姓名或 Email" oninput="renderMembers()"><span id="memberCount" class="pill">0</span></div>
        <div id="listStatus" class="status"></div>
        <div id="memberList" class="memberList"></div>
      </div>
    </div>
  </section>
</div>
<script>
const SUPABASE_URL='https://sopjtukcrghvgemdishz.supabase.co';
const SUPABASE_KEY='sb_publishable_ltqt7kjBSZE-YO3SRnnbxg_uqmt6Ooh';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let MEMBERS=[];
const $=id=>document.getElementById(id);
function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function setStatus(id,msg,kind=''){const e=$(id);e.textContent=msg;e.className='status'+(kind?' '+kind:'')}
function calcExpiry(start,duration){if(duration==='permanent')return null;if(duration==='custom')return $('newExpiry').value||null;const d=new Date(start+'T00:00:00');d.setDate(d.getDate()+Number(duration)-1);return d.toISOString().slice(0,10)}
function durationChanged(){$('customExpiryWrap').classList.toggle('hidden',$('newDuration').value!=='custom')}
async function invoke(body){const {data,error}=await sb.functions.invoke('admin-members',{body});if(error)throw new Error(error.message||'Function error');if(data?.error)throw new Error(data.error);return data}
async function adminLogin(){setStatus('loginStatus','正在登录…');const email=$('adminEmail').value.trim(),password=$('adminPassword').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error||!data?.user){setStatus('loginStatus','登录失败，请检查 Email 与密码。','err');return}try{await refreshMembers();$('loginView').classList.add('hidden');$('dashboardView').classList.remove('hidden')}catch(e){await sb.auth.signOut();setStatus('loginStatus','这个账号不是管理员，或 Admin Function 尚未部署。\n'+e.message,'err')}}
async function adminLogout(){await sb.auth.signOut();$('dashboardView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function createMember(){const name=$('newName').value.trim(),email=$('newEmail').value.trim().toLowerCase(),start=$('newStart').value||today(),duration=$('newDuration').value,expiry=calcExpiry(start,duration);if(!email){setStatus('createStatus','请输入 Email。','err');return}if(duration==='custom'&&!expiry){setStatus('createStatus','请选择自订到期日期。','err');return}setStatus('createStatus','正在建立账号…');$('tempResult').classList.remove('show');try{const r=await invoke({action:'create',display_name:name,email,start_date:start,expiry_date:expiry});$('tempPassword').textContent=r.temporary_password;$('tempResult').classList.add('show');setStatus('createStatus','✓ 学员账号与课程权限已建立。','ok');$('newName').value='';$('newEmail').value='';await refreshMembers()}catch(e){setStatus('createStatus',e.message,'err')}}
function copyTempPassword(){navigator.clipboard.writeText($('tempPassword').textContent||'');setStatus('createStatus','✓ 临时密码已复制。','ok')}
async function refreshMembers(){setStatus('listStatus','正在读取学员名单…');try{const r=await invoke({action:'list'});MEMBERS=r.members||[];setStatus('listStatus','');renderMembers()}catch(e){setStatus('listStatus',e.message,'err');throw e}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderMembers(){const q=($('searchMember')?.value||'').trim().toLowerCase();const arr=MEMBERS.filter(m=>!q||String(m.display_name||'').toLowerCase().includes(q)||String(m.email||'').toLowerCase().includes(q));$('memberCount').textContent=arr.length+' 位';$('memberList').innerHTML=arr.length?arr.map(m=>`<div class="member"><div class="memberHead"><div><div class="memberName">${esc(m.display_name||'未填写姓名')}</div><div class="memberEmail">${esc(m.email||'')}</div></div><span class="pill ${m.status==='active'?'':'inactive'}">${esc((m.status||'').toUpperCase())}</span></div><div class="memberGrid"><div><label>状态</label><select id="st_${m.user_id}"><option value="active" ${m.status==='active'?'selected':''}>active</option><option value="inactive" ${m.status==='inactive'?'selected':''}>inactive</option><option value="expired" ${m.status==='expired'?'selected':''}>expired</option><option value="cancelled" ${m.status==='cancelled'?'selected':''}>cancelled</option></select></div><div><label>开始日期</label><input id="sd_${m.user_id}" type="date" value="${m.start_date||''}"></div><div><label>到期日期</label><input id="ed_${m.user_id}" type="date" value="${m.expiry_date||''}"></div></div><div class="actions"><button class="btn" onclick="saveAccess('${m.user_id}')">保存权限</button><button class="btn soft" onclick="resetTemp('${m.user_id}','${esc((m.email||'').replace(/'/g,''))}')">重置临时密码</button></div><div id="msg_${m.user_id}" class="status"></div></div>`).join(''):'<div class="note">目前没有符合条件的学员。</div>'}
async function saveAccess(uid){const status=$('st_'+uid).value,start_date=$('sd_'+uid).value||null,expiry_date=$('ed_'+uid).value||null,id='msg_'+uid;setStatus(id,'正在保存…');try{await invoke({action:'update_access',user_id:uid,status,start_date,expiry_date});setStatus(id,'✓ 已更新课程权限。','ok');await refreshMembers()}catch(e){setStatus(id,e.message,'err')}}
async function resetTemp(uid,email){if(!confirm('确定要为 '+email+' 重新生成临时密码吗？'))return;const id='msg_'+uid;setStatus(id,'正在生成临时密码…');try{const r=await invoke({action:'reset_password',user_id:uid});setStatus(id,'临时密码：'+r.temporary_password+'（已尝试复制）','ok');await navigator.clipboard.writeText(r.temporary_password).catch(()=>{})}catch(e){setStatus(id,e.message,'err')}}
(async()=>{$('newStart').value=today();const {data:{session}}=await sb.auth.getSession();if(session?.user){try{await refreshMembers();$('loginView').classList.add('hidden');$('dashboardView').classList.remove('hidden')}catch(e){await sb.auth.signOut()}}})();
</script>
</body></html>
